<!DOCTYPE html>
<html>
<head><title>Document Vault</title><style>body { font-family: sans-serif; padding: 20px; }</style></head>
<body>
    <a href="/profile">← Back to Profile</a>
    <h1>Document Vault</h1>
    <p>All documents are stored locally and encrypted.</p>

    <form action="/profile/documents/upload" method="post" enctype="multipart/form-data">
        <select name="doc_type" required>
            <option value="Resume">Resume</option>
            <option value="PAN Card">PAN Card</option>
            <option value="Aadhaar">Aadhaar</option>
            <option value="Degree">Degree</option>
            <option value="Transcript">Transcript</option>
        </select>
        <input type="file" name="file" required>
        <button type="submit">Secure Upload</button>
    </form>

    <h2>Stored Documents</h2>
    <ul>
        {% for doc in documents %}
        <li>{{ doc.type }} - <a href="/profile/documents/{{ doc.id }}/view">View Securely</a></li>
        {% else %}
        <li>No documents uploaded.</li>
        {% endfor %}
    </ul>
</body>
</html>
