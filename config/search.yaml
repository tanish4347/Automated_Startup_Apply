# Discovery configuration. Loaded by autoapply.config.load_search_config().

# Keyword searches (LinkedIn guest search and Remotive).
queries:
  - software engineer intern
  - machine learning intern
  - backend intern
  - data science intern
  - AI intern
  - research intern

# Tags queried on RemoteOK.
remoteok_tags:
  - software-engineering-intern
  - machine-learning-intern
  - intern
  - internship

linkedin:
  locations: [India, Bengaluru, Mumbai, Remote]
  max_pages: 2

sources:
  unstop: true
  internshala: true
  instahyre: true
  himalayas: true
  adzuna: true        # skipped unless ADZUNA_APP_ID / ADZUNA_APP_KEY are set (.env)
  # Retired: 441 postings between them, 0 in-policy. US/EU remote boards with no Indian
  # internships; re-enable if that changes.
  remoteok: false
  remotive: false
  arbeitnow: false
  linkedin: true
  ats_boards: true     # companies' own ATS boards, as resolved by `autoapply ats resolve`
  # Browser tier (autoapply discover --browser)
  naukri: true
  wellfound: true
  yc_waas: false       # retired: 30 postings, 0 in-policy (logged-out teaser is US full-time)

# Every open listing is pulled (~700 internships); there is no working category filter
# server-side, so evaluate_job() does the filtering.
unstop:
  opportunities: [internships, jobs]
  # oppstatus=open caps the pool at ~700 internships + ~745 jobs, so paging runs to exhaustion
  # (empty next_page_url) rather than to a page cap. Search terms add engineering slices that the
  # category filters cannot: Unstop ignores category/domain server-side.
  search_terms: ["", software, developer, engineer, "machine learning", "data science",
                 "artificial intelligence", python, "web development", "full stack", backend, analyst]
  max_pages: 40
internshala:
  categories:
    - computer-science-internship
    - software-development-internship
    - backend-development-internship
    - frontend-development-internship
    - full-stack-development-internship
    - web-development-internship
    - mobile-app-development-internship
    - android-app-development-internship
    - ios-app-development-internship
    - python-django-internship
    - java-development-internship
    - javascript-development-internship
    - node-js-development-internship
    - react-js-development-internship
    - flutter-development-internship
    - devops-internship
    - cloud-computing-internship
    - software-testing-internship
    - cyber-security-internship
    - blockchain-development-internship
    - game-development-internship
    - ui-ux-design-internship
    - machine-learning-internship
    - data-science-internship
    - artificial-intelligence-ai-internship
    - deep-learning-internship
    - natural-language-processing-nlp-internship
    - computer-vision-internship
    - data-analytics-internship
    - big-data-internship
    - work-from-home-computer-science-internships
    - work-from-home-software-development-internships
    - work-from-home-web-development-internships
    - work-from-home-data-science-internships
    - work-from-home-machine-learning-internships
    - work-from-home-artificial-intelligence-ai-internships
    - work-from-home-python-django-internships
    - computer-science-internship-in-mumbai
    - software-development-internship-in-mumbai
    - data-science-internship-in-mumbai
    - web-development-internship-in-mumbai
    - machine-learning-internship-in-mumbai
  max_pages: 25
  fetch_details: true
instahyre:
  # internship is only ~63 jobs site-wide; entry_level adds the 0-1 year roles the classifier can
  # still accept.
  experience_levels: [internship, entry_level]
  max_pages: 10
himalayas:
  employment_types: [Intern]
  max_pages: 80
  feed_pages: 0

adzuna:
  queries: [intern, internship]
  max_pages: 5

# ── Browser tier ─────────────────────────────────────────────────────────────
# Budgets and pacing live in config/politeness.yaml.

# Internships plus 0-1 year roles. experience: 0 = fresher; wfhType 2 = remote;
# cityTypeGid 134 = Mumbai.
naukri:
  # 20 jobs per page. Aggressive by request: wide keyword set, Mumbai and remote slices, deep paging.
  searches:
    - {keyword: software developer intern}
    - {keyword: software engineer intern}
    - {keyword: machine learning intern}
    - {keyword: data science intern}
    - {keyword: data analyst intern}
    - {keyword: ai intern}
    - {keyword: python developer intern}
    - {keyword: web developer intern}
    - {keyword: backend developer intern}
    - {keyword: frontend developer intern}
    - {keyword: full stack intern}
    - {keyword: android developer intern}
    - {keyword: devops intern}
    - {keyword: research intern}
    - {keyword: internship, wfhType: 2}
    - {keyword: internship, cityTypeGid: 134}
    - {keyword: software intern, cityTypeGid: 134}
    - {keyword: data intern, cityTypeGid: 134}
    - {keyword: software engineer, experience: 0}
    - {keyword: machine learning engineer, experience: 0}
    - {keyword: data scientist, experience: 0}
    - {keyword: python developer, experience: 0}
    - {keyword: full stack developer, experience: 0}
    - {keyword: data analyst, experience: 0}
    - {keyword: software developer, experience: 0, cityTypeGid: 134}
    - {keyword: trainee engineer, experience: 0}
  max_pages: 25
  fetch_details: true
wellfound:
  # Logged out there is no employment-type filter, so intern-scoped role slugs are used and the
  # classifier rejects the rest.
  roles: [software-engineer-intern, data-science-intern, machine-learning-engineer,
          software-engineer, data-scientist]
  locations: [india, mumbai, remote]
  max_pages: 3
yc_waas:
  paths: [/jobs]

# Boards fetched per run by the ats_boards source (priority / Indian companies first).
ats_boards_max_companies: 500

# Where I can work. On-site/hybrid only in these cities; remote from anywhere.
# Jobs outside the policy are stored with location_fit=outside_policy, never deleted.
location_policy:
  onsite_cities: [Mumbai, Navi Mumbai, Thane]
  remote: preferred   # preferred | allowed | disallowed

# Title keywords that make a job a target field (whole-word, case-insensitive).
target_keywords:
  - data science
  - machine learning
  - ml
  - ai
  - genai
  - artificial intelligence
  - data analytic
  - nlp
  - computer vision
  - research
  - data engineer
  - software engineer
  - backend
  - full stack
  - frontend
  - developer
  - programmer
  - sde
  # Internshala names internships by skill, not role: "Web Development", "Python/Django",
  # "React Native Development", "Flutter Development".
  - development
  - python
  - web
  - android
  - flutter
  - react
  - devops

# Title keywords that mark a non-technical role.
exclude_title_keywords:
  - marketing
  - sales
  - hr
  - human resources
  - finance
  - operations
  - ops
  - design
  - legal
  - account
  - business
  - recruiter
  - customer success
  - support
  - seo
  - content
  - writer
  - event
  - talent
  - payroll
  - compliance
  - auditor
  - mechanical
  - electrical
  - civil
