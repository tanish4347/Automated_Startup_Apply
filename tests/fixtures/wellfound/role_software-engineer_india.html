 encouraged to apply.\n\nWe are an equal opportunity employer and are committed to fostering diversity and inclusivity. We do not discriminate based on race, religion, color, gender, sexual orientation, age, marital status, or disability status.\n\nJOB SYNOPSIS:\nJob Role: Software Engineer\nLocation: Bangalore\nJob type: Full-time, permanent\nExperience: 1–2 years\nIndustry Type: Software Product\nFunctional Area: Software Development", "jobType": "full-time", "liveStartAt": 1789976590, "locationNames": ["Delaware", "India", "United States", "Bengaluru"], "primaryRoleTitle": "Software Engineer", "remote": false, "remoteConfig": {"__typename": "JobListingRemoteConfig", "kind": "ONSITE", "wfhFlexible": false}, "acceptedRemoteLocationNames": ["India"], "slug": "software-engineer", "title": "Software Engineer", "compensation": "₹7.2L – ₹9L • No equity", "yearsExperienceMin": 1, "yearsExperienceMax": null, "id": "4748564", "isBookmarked": false}, "JobListingSearchResult:4766639": {"__typename": "JobListingSearchResult", "autoPosted": false, "atsSource": null, "description": "At **Shipthis**, we are building a better future for freight forwarders by evolving traditional operations into fully digital, efficient, and scalable systems. We’re a fast-growing product company where every individual has the opportunity to take ownership, move fast, and create real impact. If you enjoy solving complex problems, shaping products from the ground up, and influencing technical direction, Shipthis is the place for you.\n\nLearn more at www.shipthis.co\n\n**Role Overview**\n\nWe are looking for an associate-level Cloud &amp; Compliance Engineer to support security operations, compliance, endpoint management, cloud infrastructure, and DevOps engineering. The role will work closely with the CTO/CISO and engineering team. Security and compliance are core responsibilities; when those priorities are lighter, the engineer will focus on CI/CD, infrastructure automation, reliability, monitorin rets management.\n* Strong troubleshooting, ownership, attention to detail, and willingness to learn.\n\n**Desired Qualifications**\n\n* 1–2 years of experience with strong fundamentals are welcome.\n* Basic scripting knowledge in Python, Bash, or similar.\n* Interest in cybersecurity, cloud infrastructure, automation, and troubleshooting.\n* Exposure to AWS/GCP/Azure, Terraform, GitHub Actions, Cloudflare, OWASP, vulnerability scanners, MDM, ISO 27001, or SOC 2 is a plus, not mandatory.\n\n**We Welcome Candidates:**\n\n* Who is immediate joining\n* Female candidates returning to work after a career break are strongly encouraged.\n\n**We are an equal opportunity employer and are committed to fostering diversity and inclusivity. We do not discriminate based on race, religion, color, gender, sexual orientation, age, marital status, or disability status.**\n\n**Job Synopsys**\n* Location: Bangalore\n* Job Type: Full-time, Permanent\n* Experience: 1-2 years\n* Industry: Software Product", "jobType": "full-time", "liveStartAt": 1790242107, "locationNames": ["Bangalore Urban"], "primaryRoleTitle": "Security Engineer", "remote": false, "remoteConfig": {"__typename": "JobListingRemoteConfig", "kind": "ONSITE", "wfhFlexible": false}, "acceptedRemoteLocationNames": [], "slug": "security-devops-engineer-clone", "title": "SecOps Engineer", "compensation": "₹7.2L – ₹9L", "yearsExperienceMin": 1, "yearsExperienceMax": null, "id": "4760728", "isBookmarked": false}, "StartupResult:10194762": {"__typename": "StartupResult", "id": "10194762", "badges": [], "companySize": "SIZE_11_50", "highConcept": "We democratize access to high-quality mental healthcare", "highlightedJobListings": [{"__ref": "JobListingSearchResult:3143348"}], "logoUrl": "https://photos.wellfound.com/startups/i/10194762-7b374b9ac3a852cbc81e056b3fa3884e-medium_jpg.jpg?buster=1722302682", "name": "Allminds", "slug": "allminds-2"}, "JobListingSearchResult:3143348": {"__typename": "JobListingSearchResult", "autoPosted" re and building performant applications\nStrong proficiency in React JS, HTML, and CSS for front-end development.\nExtensive experience with Node JS and Python for back-end development.\nAPI integration experience strongly preferred.\nFamiliarity with Google Cloud and Firebase is strongly preferred. \nFamiliarity with building secure backend systems and dev ops is strongly preferred. \nExcellent problem-solving and critical-thinking skills, with the ability to learn quickly and adapt to new technologies.\nStrong communication skills, with the ability to work effectively in a remote team environment.\nPassion for our mission to provide affordable, high-quality mental healthcare to all.\n\n**What We Offer**:\nCompetitive salary and benefits package, commensurate with experience.\nOpportunity to work remotely, with a flexible schedule that promotes work-life balance.\nA supportive and collaborative work environment, where your contributions will have a direct impact on countless lives.\nOpportunities for personal and professional growth within a fast-growing, innovative company.\nIf you are an experienced Senior Full-Stack Software Engineer with a passion for making a difference, we would love to hear from you. \n\n**Process**:\nIf you’re interested, please submit your resume and a link to your github profile, outlining your relevant experience and interest in our mission. We’ll conduct 4 interviews: \n1 Screening interview (Both technical and behavioral) \n1 Coding interview\n1 System design interview\n1 Behavioral interview \n\nAll interviews will be conducted by the co-founders of the team. \n\n**About Allminds**: \nAllminds was founded by [Juan Ordonez](https://www.linkedin.com/in/jdordonez/) &amp; [Gagan Mac](https://www.linkedin.com/in/gaganmac/) in San Francisco in 2019 to make high-quality mental healthcare more accessible. The company is backed by the Berkeley House Fund, and is profitable.", "jobType": "full-time", "liveStartAt": 1789629769, "locationNames": ["India"], "primaryRoleTitle": "Software Engineer", "remote": true, "remoteConfig": {"__typename": "JobListingRemoteConfig", "kind": "REMOTE", "wfhFlexible": false}, "acceptedRemoteLocationNames": ["India"], "slug": "staff-software-engineer", "title": "Staff Software Engineer", "compensation": "$45k – $80k • 0.005% – 0.05%", "yearsExperienceMin": 4, "yearsExperienceMax": null, "id": "3143348", "isBookmarked": false}, "StartupResult:9420307": {"__typename": "StartupResult", "id": "9420307", "badges": [], "companySize": "SIZE_11_50", "highConcept": "Modular SaaS solution for the Trades Industry", "highlightedJobListings": [{"__ref": "JobListingSearchResult:4735247"}, {"__ref": "JobListingSearchResult:4437156"}], "logoUrl": "https://photos.wellfound.com/startups/i/9420307-b6868831828b6b21c77db6e80068edca-medium_jpg.jpg?buster=1679402277", "name": "ZenTrades", "slug": "zentrades-3"}, "JobListingSearchResult:4735247": {"__typename": "JobListingSearchResult", "autoPosted": false, "atsSource": null, "description": "# Senior Software Engineer / SDE II / SDE III\n\n**Clara AI · Bangalore · Full-time**\n\n## ABOUT CLARA AI\n\nClara AI is building an AI operating system for commercial service businesses across Fire Protection, HVAC, Electrical, and Plumbing.\n\nThese businesses rely on complex workflows, phone-based operations, and legacy systems. We are building AI agents that fundamentally change how they operate.\n\nOur products include:\n\n* **AI Answering Agent** that handles customer calls 24/7\n* **Collections Agent** that helps businesses recover outstanding revenue\n* **Field Co-Pilot** that supports technicians in the field\n\nOur vision is to build an AI-native platform where intelligent agents understand workflows, take actions, and become an essential operating layer for commercial service businesses.\n\nWe are past zero. Customers are actively using our products, and we are scaling rapidly. The next phase requires engineers who can build reliable systems, move quickly, and take ownership beyond just completing assigned tasks.\n\n## THE ROLE\n\nAs a Senior Software Engineer at Clara AI, you will be a hands-on engineer responsible for building and scaling AI-native products from concept to production.\n\nYou will work closely with product, engineering, and customers to understand problems, design solutions, and ship production-quality software.\n\nThis is not a role where you simply execute predefined technical tasks. We are looking for engineers who can identify problems, make sound technical decisions, and own solutions end-to-end.\n\n## WHAT YOU'LL OWN\n\n### Build AI-native products\n\nYou will work on products where AI is a core capability.\n\nYou may work across:\n\n* AI agents and autonomous workflows\n* LLM-powered applications\n* Intelligent automation systems\n* Knowledge retrieval and reasoning systems\n* AI evaluation and improvement frameworks\n\n### Own technical problems end-to-end\n\nYou will:\n\n* Design and build production systems\n* Make technical decisions and evaluate tradeoffs\n* Build scalable APIs and backend systems\n* Work across the stack where required\n* Debug complex technical problems\n* Improve system reliability, performance, and maintainability\n* Take ownership of features from idea to production\n\n### Work closely with product and customers\n\nYou will work closely with product and business teams to understand real customer problems and translate them into technical solutions.\n\nYou will be expected to think beyond the implementation and understand the business impact of what you build.\n\n### Stay hands-on\n\nThis is a highly hands-on engineering role.\n\nYou will:\n\n* Write production-quality code\n* Prototype and test new ideas\n* Participate in architecture and system design discussions\n* Review code and improve engineering practices\n* Use AI tools extensively to improve engineering velocity\n* Continuously learn and adapt to new technologies\n\n## WHAT SUCCESS LOOKS LIKE\n\n### First 30 Days\n\n* Build strong context around Clara AI's technology and customers\n* Understand existing systems and engineering practices\n* Start shipping meaningful improvements\n* Identify opportunities to improve product or engineering velocity\n\n### First 60 Days\n\n* Own significant technical initiatives\n* Deliver production features independently\n* Improve system quality, reliability, or performance\n* Contribute meaningfully to architecture and technical decisions\n\n### First 90 Days\n\n* Independently own important areas of the product\n* Ship meaningful AI-native capabilities\n* Raise engineering quality and technical standards\n* Become a reliable technical owner within the team\n\n## WHO WE'RE LOOKING FOR\n\n### Must Have\n\n* **3–7 years of software engineering experience**\n* Strong hands-on engineering background\n* Experience building and scaling production systems\n* Strong problem-solving and engineering fundamentals\n* Experience owning features or technical initiatives end-to-end\n* Strong understanding of backend systems and APIs\n* Product mindset and ability to understand customer problems\n* Comfortable working in ambiguity and fast-changing environments\n\n### Strong Signals\n\n* Has been an early engineer or worked in a startup environment\n* Has built products or features from zero to one\n* Experience with AI-powered products or LLM applications\n* Uses AI tools extensively to improve engineering velocity\n* Strong full-stack experience\n* Has worked closely with product or customers\n* Demonstrates strong ownership beyond their defined role\n* Has a track record of learning new technologies quickly\n\n## TECHNICAL EXPECTATIONS\n\nExperience with some of the following:\n\n* MERN stack: React, Node.js, TypeScript\n* Backend architecture and APIs\n* Databases and distributed systems\n* Cloud infrastructure\n* AI/LLM applications\n* Agentic workflows\n* System design and scalability\n\nWe value strong engineering judgment and the ability to learn quickly over specific technology keywords.\n\n## THIS IS NOT FOR YOU IF\n\n* You prefer only executing predefined technical tasks\n* You need a highly structured or mature engineering environment\n* You avoid product or customer discussions\n* You are not excited about building with AI\n* You are uncomfortable taking ownership beyond your immediate task\n* You prefer optimizing for technical complexity over solving real customer problems\n\n## WHAT WE OFFER\n\n### High Ownership\n\nOwn meaningful technical problems and see your work directly impact the product.\n\n### Build with AI\n\nWork on products where AI is fundamentally changing how businesses operate.\n\n### Direct Impact\n\nYour work will power products used by real businesses every day.\n\n### High Autonomy\n\nIdentify problems, propose solutions, make technical decisions, and build.\n\n**Bangalore · Full-time · AI-native environment**", "jobType": "full-time", "liveStartAt": 1789753988, "locationNames": ["Bengaluru", "Bengaluru"], "primaryRoleTitle": "Software Engineer", "remote": false, "remoteConfig": {"__typename": "JobListingRemoteConfig", "kind": "ONSITE", "wfhFlexible": false}, "acceptedRemoteLocationNames": [], "slug": "senior-software-engineer", "title": "Senior Software Engineer", "compensation": "", "yearsExperienceMin": 2, "yearsExperienceMax": null, "id": "4735247", "isBookmarked": false}, "JobListingSearchResult:4437156": {"__typename": "JobListingSearchResult", "autoPosted": false, "atsSource": null, "description": "**Engineering Lead **\n\nLocation: Pune (Work from Office)\nExperience: 6 to 8 Years (Exceptional 5+ years candidates will also be considered)\n\n**Build the Future of AI for the Trades Industry**\n\nAt ZenTrades, we're reimagining how trade businesses operate.\n\nOur mission is to transform an industry that has long been underserved by technology through an AI-first platform that simplifies operations, improves efficiency, and helps businesses grow. From field operations and customer management to workflow automation and intelligent decision-making, we're building a modern B2B SaaS CRM platform designed for the future.\n\nWe're still early in our journey, which means every engineer has the opportunity to make a visible impact. Decisions are made quickly, ideas are heard, and ownership is real.\n\nWe're now looking for an Engineering Lead who wants to build, lead, and scale alongside us.\nThis isn't a role where you'll inherit a mature engineering organization with layers of management. \n\nThis is an opportunity to shape the product, influence technical direction, mentor engineers, and build the engineering culture from the ground up.\n\nIf you enjoy solving difficult problems, writing production-grade code, working directly with founders, and building products that customers genuinely love, we'd love to talk.\n\n**What You'll Be Responsible For**\nAs our Engineering Lead, you'll wear multiple hats. You'll be a builder, mentor, architect, and technical leader.\n\n**You'll:**\nLead the design and development of our core B2B SaaS platform.\nWrite high-quality, production-ready code and contribute hands-on to feature development.\nDesign scalable, reliable, and maintainable system architecture.\nDrive technical decisions and establish engineering best practices.\nReview code and maintain high engineering standards across the team.\nMentor engineers through coaching, technical guidance, and regular feedback.\nWork closely with Product, Design, Customer Success, and the Founder to translate business problems into elegant technical solutions.\nBuild and scale engineering processes that enable fast, high-quality product delivery.\nIntroduce AI capabilities and intelligent automation into our platform.\nImprove platform performance, security, reliability, and scalability.\nParticipate in hiring and help build a world-class engineering team.\nTake ownership of production systems and ensure a great customer experience.\n\n**What We're Looking For**\nWe're looking for someone who enjoys building in fast-moving startup environments and is excited by ownership.\n\n**You should have:**\n6 to 8 years of software engineering experience (5+ years for exceptional candidates).\nStrong expertise in the MERN stack (MongoDB, Express.js, React, Node.js).\nExperience designing scalable backend systems and distributed architectures.\nStrong understanding of REST APIs, databases, authentication, and cloud infrastructure.\nExperience deploying and managing applications on AWS.\nExcellent knowledge of software engineering best practices, testing, code reviews, and CI/CD.\nExperience leading or mentoring engineering teams.\nThe ability to balance speed with engineering quality.\nStrong problem-solving skills and sound technical judgment.\nExcellent communication and collaboration skills.\n\n**Bonus Points If You Have**\nExperience working at an early-stage startup.\nBeen a Founding Engineer, Founding Team member, or Technical Co-founder.\nBuilt products from scratch and scaled them.\nExperience integrating Large Language Models (LLMs) and AI capabilities into production applications.\nWorked with OpenAI, Anthropic, vector databases, RAG architectures, or AI agents.\nExperience with Docker, Redis, Microservices, GraphQL, or TypeScript.\nBuilt customer-facing B2B SaaS products.\n\n**Who Will Thrive Here**\nYou'll enjoy this role if you:\nLove building products from zero to one.\nLike solving complex technical challenges.\nPrefer ownership over hierarchy.\nAre comfortable making decisions with incomplete information.\nEnjoy mentoring engineers while staying deeply hands-on.\nCare about customers as much as clean architecture.\nCan move quickly without compromising quality.\nWant to help shape engineering culture instead of simply fitting into one.\n\n**What Success Looks Like**\n\n**In Your First 30 Days**\nUnderstand the product, customers, and architecture.\nStart contributing production code.\nBuild relationships acro
