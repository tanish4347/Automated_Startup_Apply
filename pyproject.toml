[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoapply"
version = "0.1.0"
description = "Automated job application system"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.12,<2.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "httpx>=0.25,<1.0",
    "structlog>=23.0",
    "apscheduler>=3.10,<4.0",
    "fastapi>=0.104,<1.0",
    "uvicorn[standard]>=0.24,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "aiofiles>=23.0",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]
browser = [
    "playwright>=1.40",
]

[tool.setuptools.packages.find]
include = ["autoapply*"]

[tool.setuptools.package-data]
"autoapply.dashboard" = ["templates/*.html"]

[project.scripts]
autoapply = "autoapply.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
